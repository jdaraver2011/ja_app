name: Publish JA 2.8.2 device update
on:
  push:
    branches: [v2.8.2]
    paths:
      - .github/workflows/build-v2.8.2.yml
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: true
      publish_update: true
      build_variant: debug
    secrets: inherit
