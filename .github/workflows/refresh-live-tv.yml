name: Refresh verified US Live TV catalog
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    branches: [v2.1.6]
    paths: ['.github/workflows/refresh-live-tv.yml']
permissions:
  contents: write
concurrency:
  group: ja-live-tv-catalog
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: live-tv-data
      - name: Test continuous-stream classification
        run: python3 -m unittest discover -s scripts -p 'test_live_scan.py'
      - name: Rescan all United States stream candidates
        run: python3 scripts/scan_live_tv.py --output catalog.json --report scan-report.json
      - name: Save verified catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json scan-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified U.S. live TV catalog'
            git push origin HEAD:live-tv-data
          fi
