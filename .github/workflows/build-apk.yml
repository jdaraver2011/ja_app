
name: Build JA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use a writable SDK directory instead of
      # modifying the runner's system SDK.
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/ja-android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          TOOLS_ZIP="commandlinetools-linux-13114758_latest.zip"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/$TOOLS_ZIP" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP"

          cp -a "$RUNNER_TEMP/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          # Accept Android SDK licenses
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          # Install required Android packages
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Android SDK installation completed"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile JA APK
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AUTHORIZED_EMBED_TEMPLATE: ${{ secrets.AUTHORIZED_EMBED_TEMPLATE }}
          AUTHORIZED_EMBED_HOST: ${{ secrets.AUTHORIZED_EMBED_HOST }}
        run: |
          set -euo pipefail

          echo "Starting JA Android compilation"

          # Supply the SDK location and app configuration.
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            printf 'AUTHORIZED_EMBED_TEMPLATE=%s\n' "$AUTHORIZED_EMBED_TEMPLATE"
            printf 'AUTHORIZED_EMBED_HOST=%s\n' "$AUTHORIZED_EMBED_HOST"
          } > local.properties

          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload JA APK
        uses: actions/upload-artifact@v4
        with:
          name: JA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
