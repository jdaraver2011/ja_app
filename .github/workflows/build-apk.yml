name: Build JA APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: ja-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 37.2
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check player scripts
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find app/src/main/assets -name '*.js' -print0)
          node tests/source-status.test.cjs
          node tests/video-lookup.test.cjs
      - name: Configure build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AUTHORIZED_EMBED_TEMPLATE: ${{ secrets.AUTHORIZED_EMBED_TEMPLATE }}
          AUTHORIZED_EMBED_HOST: ${{ secrets.AUTHORIZED_EMBED_HOST }}
          DIRECT_MEDIA_TEMPLATE: ${{ secrets.DIRECT_MEDIA_TEMPLATE }}
          DIRECT_MEDIA_HOST: ${{ secrets.DIRECT_MEDIA_HOST }}
        run: python3 scripts/configure_build.py
      - name: Test startup ordering
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-startup-tests" app/src/main/java/com/example/ja/JaStartupBarrier.java tests/JaStartupBarrierTest.java
          java -cp "$RUNNER_TEMP/ja-startup-tests" com.example.ja.JaStartupBarrierTest
      - name: Test media cadence sampling
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-cadence-tests" app/src/main/java/com/example/ja/JaFrameRateSampler.java tests/JaFrameRateSamplerTest.java
          java -cp "$RUNNER_TEMP/ja-cadence-tests" com.example.ja.JaFrameRateSamplerTest
      - name: Test blocker selection lifecycle
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-blocker-tests" app/src/main/java/com/example/ja/JaBlockerLifecycleState.java tests/JaBlockerLifecycleStateTest.java
          java -cp "$RUNNER_TEMP/ja-blocker-tests" com.example.ja.JaBlockerLifecycleStateTest
      - name: Test watched threshold and page focus rules
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-watch-tests" app/src/main/java/com/example/ja/JaWatchRules.java tests/JaWatchRulesTest.java
          java -cp "$RUNNER_TEMP/ja-watch-tests" com.example.ja.JaWatchRulesTest
      - name: Test metadata cache expiry and eviction
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-cache-tests" app/src/main/java/com/example/ja/JaTimedCache.java tests/JaTimedCacheTest.java
          java -cp "$RUNNER_TEMP/ja-cache-tests" com.example.ja.JaTimedCacheTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Report Android lint findings
        continue-on-error: true
        run: gradle --no-daemon lintDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JA-1.1.6-review9-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JA-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
