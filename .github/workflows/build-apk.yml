
name: Build JA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04

    steps:
      # Step 1 - Download JA source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 - Install Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3 - Install Android SDK in writable directory
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/ja-android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          TOOLS_ZIP="commandlinetools-linux-13114758_latest.zip"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/$TOOLS_ZIP" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP"

          cp -a "$RUNNER_TEMP/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          # Accept Android licenses
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          # Install required Android SDK packages
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Android SDK installation complete"

      # Step 4 - Configure Gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 5 - Correct Properties reference in Kotlin DSL
      - name: Fix Gradle Kotlin DSL Properties
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          content = path.read_text()

          # Add Java Properties import if missing.
          if not re.search(
              r'(?m)^\s*import\s+java\.util\.Properties\s*$',
              content
          ):
              content = "import java.util.Properties\n" + content

          # Replace the problematic fully qualified reference.
          content = content.replace(
              "java.util.Properties()",
              "Properties()"
          )

          path.write_text(content)

          print("Gradle Kotlin DSL Properties fix applied")
          PY

      # Step 6 - Configure JA application settings
      - name: Configure JA Build
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AUTHORIZED_EMBED_TEMPLATE: ${{ secrets.AUTHORIZED_EMBED_TEMPLATE }}
          AUTHORIZED_EMBED_HOST: ${{ secrets.AUTHORIZED_EMBED_HOST }}
        run: |
          set -euo pipefail

          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            printf 'AUTHORIZED_EMBED_TEMPLATE=%s\n' "$AUTHORIZED_EMBED_TEMPLATE"
            printf 'AUTHORIZED_EMBED_HOST=%s\n' "$AUTHORIZED_EMBED_HOST"
          } > local.properties

          echo "JA build configuration created"

      # Step 7 - Compile Android APK
      - name: Compile JA APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting JA Android compilation"

          gradle --no-daemon --stacktrace assembleDebug

      # Step 8 - Upload APK artifact
      - name: Upload JA APK
        uses: actions/upload-artifact@v4
        with:
          name: JA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
