name: Build JA APK
on:
  workflow_call:
    inputs:
      run_checks:
        type: boolean
        default: true
      publish_update:
        type: boolean
        default: false
      build_variant:
        type: string
        default: debug
      generate_baseline_profile:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run automated tests and lint
        type: boolean
        default: true
      publish_update:
        description: Publish this version as a public device update
        type: boolean
        default: false
      build_variant:
        description: APK build variant
        type: choice
        options: [debug, release]
        default: debug
      generate_baseline_profile:
        description: Generate and package a Baseline Profile
        type: boolean
        default: false
  push:
    branches: [main, master, v2.6.0-supabase-test, v2.6.2, v2.6.3]
permissions:
  contents: read
concurrency:
  group: ja-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 37.2
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.6.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install weather media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build bundled WeatherStar client
        run: python3 scripts/build-weatherstar.py
      - name: Build offline MilkDrop-compatible visualizer
        run: python3 scripts/build-music-visualizer.py
      - name: Smoke test bundled weather presentation
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          python3 -m pip install --user playwright==1.56.0
          python3 tests/weatherstar-smoke.py
          python3 tests/music-visualizer-smoke.py
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-pcm" app/src/main/java/com/example/ja/JaMusicPcm.java tests/JaMusicPcmTest.java
          java -cp "$RUNNER_TEMP/ja-pcm" com.example.ja.JaMusicPcmTest
      - name: Check WeatherStar condition graphics
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-weather-icons" app/src/main/java/com/example/ja/JaWeatherIcons.java tests/JaWeatherIconsTest.java
          java -cp "$RUNNER_TEMP/ja-weather-icons" com.example.ja.JaWeatherIconsTest
      - name: Check navigation levels
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-navigation-tests" app/src/main/java/com/example/ja/JaNavigationRules.java tests/JaNavigationRulesTest.java
          java -cp "$RUNNER_TEMP/ja-navigation-tests" com.example.ja.JaNavigationRulesTest
      - name: Check player scripts
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find app/src/main/assets -name '*.js' -print0)
          node tests/music-canvas-size.test.cjs
          node tests/movy-landing.test.cjs
          node tests/source-status.test.cjs
          node tests/video-lookup.test.cjs
          node tests/vidfast-api.test.cjs
          node tests/overlay-guard.test.cjs
          node tests/overlay-workload.bench.cjs
          node tests/quality-activation.test.cjs
          node tests/quality-menu-mask.test.cjs
      - name: Test update acceptance and release metadata
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-update-tests" app/src/main/java/com/example/ja/JaUpdateRules.java tests/JaUpdateRulesTest.java
          java -cp "$RUNNER_TEMP/ja-update-tests" com.example.ja.JaUpdateRulesTest
          python3 tests/update-release.test.py
      - name: Configure build
        env:
          JA_UPDATE_REPOSITORY: ${{ vars.JA_UPDATE_REPOSITORY || github.repository }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AUTHORIZED_EMBED_TEMPLATE: ${{ secrets.AUTHORIZED_EMBED_TEMPLATE }}
          AUTHORIZED_EMBED_HOST: ${{ secrets.AUTHORIZED_EMBED_HOST }}
          DIRECT_MEDIA_TEMPLATE: ${{ secrets.DIRECT_MEDIA_TEMPLATE }}
          DIRECT_MEDIA_HOST: ${{ secrets.DIRECT_MEDIA_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/configure_build.py
      - name: Test TV season source preferences
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-season-source-tests" app/src/main/java/com/example/ja/JaTvSeasonSourceRules.java tests/JaTvSeasonSourceRulesTest.java
          java -cp "$RUNNER_TEMP/ja-season-source-tests" com.example.ja.JaTvSeasonSourceRulesTest
      - name: Test TV episode release delay
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-episode-release-tests" app/src/main/java/com/example/ja/JaEpisodeReleaseRules.java tests/JaEpisodeReleaseRulesTest.java
          java -cp "$RUNNER_TEMP/ja-episode-release-tests" com.example.ja.JaEpisodeReleaseRulesTest
      - name: Test Live TV playlist, guide and distance rules
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          mkdir -p /tmp/ja-live-tests
          javac -d /tmp/ja-live-tests app/src/main/java/com/example/ja/JaLiveTvRules.java tests/JaLiveTvRulesTest.java
          java -cp /tmp/ja-live-tests com.example.ja.JaLiveTvRulesTest
          javac -d /tmp/ja-live-tests app/src/main/java/com/example/ja/JaLiveTvRecovery.java tests/JaLiveTvRecoveryTest.java
          java -cp /tmp/ja-live-tests com.example.ja.JaLiveTvRecoveryTest
      - name: Test IPTV favorite ordering
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-live-order-tests" app/src/main/java/com/example/ja/JaLiveTvOrder.java tests/JaLiveTvOrderTest.java
          java -cp "$RUNNER_TEMP/ja-live-order-tests" com.example.ja.JaLiveTvOrderTest
      - name: Test IPTV channel move transactions
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-live-move-tests" app/src/main/java/com/example/ja/JaLiveTvOrder.java app/src/main/java/com/example/ja/JaLiveTvMoveSession.java tests/JaLiveTvMoveSessionTest.java
          java -cp "$RUNNER_TEMP/ja-live-move-tests" com.example.ja.JaLiveTvMoveSessionTest
      - name: Test IPTV guide geometry, Groups boundaries and held-menu keys
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-guide-ui-tests" app/src/main/java/com/example/ja/JaLiveTvGuideRules.java tests/JaLiveTvGuideRulesTest.java
          java -cp "$RUNNER_TEMP/ja-guide-ui-tests" com.example.ja.JaLiveTvGuideRulesTest
      - name: Test six-hour weather imagery rules
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-imagery-tests" app/src/main/java/com/example/ja/JaWeatherMediaRules.java tests/JaWeatherMediaRulesTest.java
          java -cp "$RUNNER_TEMP/ja-imagery-tests" com.example.ja.JaWeatherMediaRulesTest
      - name: Test weather units and ZIP validation
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-weather-tests" app/src/main/java/com/example/ja/JaWeatherRules.java tests/JaWeatherRulesTest.java
          java -cp "$RUNNER_TEMP/ja-weather-tests" com.example.ja.JaWeatherRulesTest
      - name: Test resume labels
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-resume-label-tests" app/src/main/java/com/example/ja/JaResumeLabels.java tests/JaResumeLabelsTest.java
          java -cp "$RUNNER_TEMP/ja-resume-label-tests" com.example.ja.JaResumeLabelsTest
      - name: Test music navigation and audio ownership
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-music-tests" app/src/main/java/com/example/ja/JaMusicRules.java tests/JaMusicRulesTest.java
          java -cp "$RUNNER_TEMP/ja-music-tests" com.example.ja.JaMusicRulesTest
      - name: Test native music stripe decoding and seek ranges
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-deezer-tests" app/src/main/java/com/example/ja/JaDeezerStripeInputStream.java tests/JaDeezerStripeInputStreamTest.java
          java -cp "$RUNNER_TEMP/ja-deezer-tests" com.example.ja.JaDeezerStripeInputStreamTest
      - name: Test experimental Music source coordination
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-music-source-tests" app/src/main/java/com/example/ja/experiments/music/JaMusicSourceCoordinator.java app/src/main/java/com/example/ja/experiments/music/JaMusicExperimentChecks.java
          java -cp "$RUNNER_TEMP/ja-music-source-tests" com.example.ja.experiments.music.JaMusicExperimentChecks
      - name: Test row jump indexing
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-row-jump-tests" app/src/main/java/com/example/ja/JaRowJumpIndex.java tests/JaRowJumpIndexTest.java
          java -cp "$RUNNER_TEMP/ja-row-jump-tests" com.example.ja.JaRowJumpIndexTest
      - name: Test additional TMDB source URLs
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-additional-source-tests" app/src/main/java/com/example/ja/JaAdditionalTmdbUrls.java tests/JaAdditionalTmdbUrlsTest.java
          java -cp "$RUNNER_TEMP/ja-additional-source-tests" com.example.ja.JaAdditionalTmdbUrlsTest
      - name: Test startup ordering
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-startup-tests" app/src/main/java/com/example/ja/JaStartupBarrier.java tests/JaStartupBarrierTest.java
          java -cp "$RUNNER_TEMP/ja-startup-tests" com.example.ja.JaStartupBarrierTest
      - name: Test media cadence sampling
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-cadence-tests" app/src/main/java/com/example/ja/JaFrameRateSampler.java tests/JaFrameRateSamplerTest.java
          java -cp "$RUNNER_TEMP/ja-cadence-tests" com.example.ja.JaFrameRateSamplerTest
      - name: Test blocker selection lifecycle
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-blocker-tests" app/src/main/java/com/example/ja/JaBlockerLifecycleState.java tests/JaBlockerLifecycleStateTest.java
          java -cp "$RUNNER_TEMP/ja-blocker-tests" com.example.ja.JaBlockerLifecycleStateTest
      - name: Test watched threshold and page focus rules
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-watch-tests" app/src/main/java/com/example/ja/JaWatchRules.java tests/JaWatchRulesTest.java
          java -cp "$RUNNER_TEMP/ja-watch-tests" com.example.ja.JaWatchRulesTest
      - name: Test metadata cache expiry and eviction
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-cache-tests" app/src/main/java/com/example/ja/JaTimedCache.java tests/JaTimedCacheTest.java
          java -cp "$RUNNER_TEMP/ja-cache-tests" com.example.ja.JaTimedCacheTest
      - name: Test display mode recovery
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-recovery-tests" app/src/main/java/com/example/ja/JaFrameRateRecovery.java tests/JaFrameRateRecoveryTest.java
          java -cp "$RUNNER_TEMP/ja-recovery-tests" com.example.ja.JaFrameRateRecoveryTest
      - name: Test double Back exit timing
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-exit-tests" app/src/main/java/com/example/ja/JaDoubleBackExit.java tests/JaDoubleBackExitTest.java
          java -cp "$RUNNER_TEMP/ja-exit-tests" com.example.ja.JaDoubleBackExitTest
      - name: Test biography reading and escape controls
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-biography-tests" app/src/main/java/com/example/ja/JaBiographyNavigation.java tests/JaBiographyNavigationTest.java
          java -cp "$RUNNER_TEMP/ja-biography-tests" com.example.ja.JaBiographyNavigationTest
      - name: Test movie release cutoff
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-release-tests" app/src/main/java/com/example/ja/JaMovieReleaseRules.java tests/JaMovieReleaseRulesTest.java
          java -cp "$RUNNER_TEMP/ja-release-tests" com.example.ja.JaMovieReleaseRulesTest
      - name: Test independent genre membership
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-genre-tests" app/src/main/java/com/example/ja/JaGenreCatalog.java tests/JaGenreCatalogTest.java
          java -cp "$RUNNER_TEMP/ja-genre-tests" com.example.ja.JaGenreCatalogTest
      - name: Test catalogue refresh lifecycle
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-catalog-refresh-tests" app/src/main/java/com/example/ja/JaCatalogRefresh.java tests/JaCatalogRefreshTest.java
          java -cp "$RUNNER_TEMP/ja-catalog-refresh-tests" com.example.ja.JaCatalogRefreshTest
      - name: Test VidSrc feed parsing and freshness
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-vidsrc-tests" app/src/main/java/com/example/ja/JaVidSrcRules.java tests/JaVidSrcRulesTest.java
          java -cp "$RUNNER_TEMP/ja-vidsrc-tests" com.example.ja.JaVidSrcRulesTest
      - name: Test VidFast playback confirmation
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-vidfast-tests" app/src/main/java/com/example/ja/JaVidFastTimeline.java tests/JaVidFastTimelineTest.java
          java -cp "$RUNNER_TEMP/ja-vidfast-tests" com.example.ja.JaVidFastTimelineTest
      - name: Test playback performance windows
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-perf-tests" app/src/main/java/com/example/ja/JaPlaybackWindow.java tests/JaPlaybackWindowTest.java
          java -cp "$RUNNER_TEMP/ja-perf-tests" com.example.ja.JaPlaybackWindowTest
      - name: Test confirmed frame-rate warmup
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-warmup-tests" app/src/main/java/com/example/ja/JaFrameStatsWarmup.java app/src/main/java/com/example/ja/JaFrameRateSampler.java tests/JaFrameStatsWarmupTest.java
          java -cp "$RUNNER_TEMP/ja-warmup-tests" com.example.ja.JaFrameStatsWarmupTest
      - name: Test catalogue pagination
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          java com.sun.tools.javac.Main -d "$RUNNER_TEMP/ja-pagination-tests" app/src/main/java/com/example/ja/JaCatalogBatch.java app/src/main/java/com/example/ja/JaGenreCatalog.java tests/JaCatalogBatchTest.java
          java -cp "$RUNNER_TEMP/ja-pagination-tests" com.example.ja.JaCatalogBatchTest
      - name: Restore persistent signing key
        env:
          JA_KEYSTORE_BASE64: ${{ secrets.JA_KEYSTORE_BASE64 }}
          JA_KEYSTORE_PASSWORD: ${{ secrets.JA_KEYSTORE_PASSWORD }}
          JA_KEY_ALIAS: ${{ secrets.JA_KEY_ALIAS }}
          JA_KEY_PASSWORD: ${{ secrets.JA_KEY_PASSWORD }}
          PUBLISH_UPDATE: ${{ inputs.publish_update || false }}
        run: python3 scripts/restore_update_signing.py
      - name: Enable KVM for Baseline Profile generation
        if: ${{ inputs.generate_baseline_profile }}
        run: sudo chmod 666 /dev/kvm
      - name: Generate JA Baseline Profile on Android 35
        if: ${{ inputs.generate_baseline_profile }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace :app:generateBaselineProfile
        env:
          JA_KEYSTORE_PASSWORD: ${{ secrets.JA_KEYSTORE_PASSWORD }}
          JA_KEY_ALIAS: ${{ secrets.JA_KEY_ALIAS }}
          JA_KEY_PASSWORD: ${{ secrets.JA_KEY_PASSWORD }}
      - name: Build installable APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
          JA_KEYSTORE_PASSWORD: ${{ secrets.JA_KEYSTORE_PASSWORD }}
          JA_KEY_ALIAS: ${{ secrets.JA_KEY_ALIAS }}
          JA_KEY_PASSWORD: ${{ secrets.JA_KEY_PASSWORD }}
        run: |
          case "$BUILD_VARIANT" in
            debug) gradle_task=assembleDebug ;;
            release) gradle_task=assembleRelease ;;
            *) echo "Unsupported APK build variant: $BUILD_VARIANT"; exit 1 ;;
          esac
          gradle --no-daemon --stacktrace ":app:$gradle_task"
      - name: Report Android lint findings
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        continue-on-error: false
        env:
          JA_KEYSTORE_PASSWORD: ${{ secrets.JA_KEYSTORE_PASSWORD }}
          JA_KEY_ALIAS: ${{ secrets.JA_KEY_ALIAS }}
          JA_KEY_PASSWORD: ${{ secrets.JA_KEY_PASSWORD }}
        run: gradle --no-daemon lintDebug
      - name: Enable KVM for music service regression
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        run: |
          sudo chmod 666 /dev/kvm
      - name: Test music foreground lifecycle on Android 35
        if: ${{ inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.ja.JaMusicForegroundTest,com.example.ja.JaMusicBrowseTest; result=$?; mkdir -p test-results; adb pull /sdcard/Android/data/com.example.ja/files/music-ui test-results/ || true; exit "$result"
        env:
          JA_KEYSTORE_PASSWORD: ${{ secrets.JA_KEYSTORE_PASSWORD }}
          JA_KEY_ALIAS: ${{ secrets.JA_KEY_ALIAS }}
          JA_KEY_PASSWORD: ${{ secrets.JA_KEY_PASSWORD }}
      - name: Upload music device regression reports
        if: ${{ always() && (inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: JA-music-service-regression
          path: |
            test-results/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: JA-${{ github.ref_name }}-${{ inputs.build_variant || 'debug' }}
          path: app/build/outputs/apk/${{ inputs.build_variant || 'debug' }}/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: ${{ always() && (inputs.run_checks || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: JA-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Prepare public update assets
        if: ${{ inputs.publish_update }}
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
          UPDATE_REPO: ${{ vars.JA_UPDATE_REPOSITORY || github.repository }}
        run: |
          case "$BUILD_VARIANT" in
            debug) apk=app/build/outputs/apk/debug/app-debug.apk ;;
            release) apk=app/build/outputs/apk/release/app-release.apk ;;
            *) echo "Unsupported APK build variant: $BUILD_VARIANT"; exit 1 ;;
          esac
          python3 scripts/prepare_update_release.py --apk "$apk" --repo "$UPDATE_REPO" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Publish device update
        if: ${{ inputs.publish_update }}
        env:
          GH_TOKEN: ${{ secrets.JA_UPDATE_PUBLISH_TOKEN || github.token }}
          UPDATE_REPO: ${{ vars.JA_UPDATE_REPOSITORY || github.repository }}
        run: |
          test "$(gh api "repos/$UPDATE_REPO" --jq '.private')" = "false" || { echo 'Updates require a public release repository.'; exit 1; }
          version=$(python3 -c 'import json; print(json.load(open("dist/ja-update.json"))["versionName"])')
          target_args=()
          if [ "$UPDATE_REPO" = "$GITHUB_REPOSITORY" ]; then target_args=(--target "$GITHUB_SHA"); fi
          gh release create "v$version" dist/JA-update.apk dist/ja-update.json --repo "$UPDATE_REPO" "${target_args[@]}" --title "JA $version" --notes 'JA device update. Install through Settings > Update Now.' --draft
          gh release edit "v$version" --repo "$UPDATE_REPO" --draft=false --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ja-update.keystore"
