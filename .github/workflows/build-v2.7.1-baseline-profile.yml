name: Build and publish JA v2.7.1
on:
  push:
    branches: [v2.7.1-baseline-profile]
    paths:
      - '.github/workflows/build-v2.7.1-baseline-profile.yml'
      - '.github/workflows/build-apk.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'baselineprofile/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: false
      publish_update: true
      build_variant: release
      generate_baseline_profile: true
    secrets: inherit
