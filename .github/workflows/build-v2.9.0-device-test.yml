name: Build JA v2.9.0 device test
on:
  push:
    branches: [v2.9.0]
    paths:
      - .github/workflows/build-v2.9.0-device-test.yml
      - .github/workflows/build-apk.yml
      - app/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: false
      publish_update: false
      build_variant: release
      generate_baseline_profile: false
    secrets: inherit
