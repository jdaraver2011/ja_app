name: Publish JA 2.9.1 device update
on:
  push:
    branches: [v2.9.1]
    paths:
      - .github/workflows/publish-v2.9.1.yml
      - .github/workflows/build-apk.yml
      - app/build.gradle.kts
      - app/src/main/java/com/example/ja/JaGeckoRuntime.kt
      - app/src/main/java/com/example/ja/JaLiveTvRepository.kt
      - app/src/main/java/com/example/ja/JaLiveTvScreen.kt
      - app/src/main/java/com/example/ja/JaLiveTvUpdates.kt
      - app/src/main/java/com/example/ja/MainActivity.kt
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/build-apk.yml
    with:
      daddylive_us_pilot: true
      run_checks: true
      publish_update: true
      build_variant: release
      generate_baseline_profile: false
    secrets: inherit
