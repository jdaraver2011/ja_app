name: Publish JA 2.8.5 device update
on:
  push:
    branches: [v2.8.5]
    paths: [.github/workflows/publish-v2.8.5.yml]
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: true
      publish_update: true
      build_variant: release
      generate_baseline_profile: false
      # Carry forward the confirmed DaddyLive USA pilot from v2.8.4.
      daddylive_us_pilot: true
    secrets: inherit
