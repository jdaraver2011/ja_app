name: Publish JA 2.7.2 device update
on:
  push:
    branches:
      - v2.7.2-settings-sync-iptv
    paths:
      - .github/workflows/publish-ja-device-update.yml
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: true
      publish_update: true
      build_variant: debug
      generate_baseline_profile: false
    secrets: inherit
