name: Build JA visualizer profiling APK
on:
  push:
    branches: [perf/visualizer-profiling]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: false
      publish_update: false
      build_variant: release
      visualizer_profiling: true
    secrets: inherit
