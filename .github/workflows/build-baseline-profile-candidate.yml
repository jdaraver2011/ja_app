name: Build JA Baseline Profile candidate
on:
  push:
    branches: [perf/baseline-profile]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      run_checks: false
      publish_update: false
      build_variant: release
      generate_baseline_profile: false
    secrets: inherit
